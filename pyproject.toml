[project]
name = "wintermute"
version = "0.1.0"
description = "Automated bug bounty reconnaissance and vulnerability detection"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
